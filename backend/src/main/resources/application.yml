server:
  port: 8080

spring:
  application:
    name: recetas
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/recetas}
    username: ${DB_USER:recetas}
    password: ${DB_PASSWORD:recetas}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  n8n-url: ${N8N_URL:http://localhost:5678/webhook/recetas-buscar}
  cors-origins: http://localhost:5500,http://127.0.0.1:5500
